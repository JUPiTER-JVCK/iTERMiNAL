# Everforest Dark — yazi theme
#
# Generated for the iterminal-everforest-dark palette by contrib/ghostty/export-themes.py --extras.
# Install to ~/.config/yazi/theme.toml.

[mgr]
cwd = { fg = "#83c092" }

find_keyword  = { fg = "#dbbc7f", bold = true, italic = true }
find_position = { fg = "#d699b6", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#a7c080", bg = "#a7c080" }
marker_cut      = { fg = "#e67e80", bg = "#e67e80" }
marker_marked   = { fg = "#83c092", bg = "#83c092" }
marker_selected = { fg = "#dbbc7f", bg = "#dbbc7f" }

count_copied   = { fg = "#2d353b", bg = "#a7c080" }
count_cut      = { fg = "#2d353b", bg = "#e67e80" }
count_selected = { fg = "#2d353b", bg = "#dbbc7f" }

border_symbol = "│"
border_style  = { fg = "#414648" }

symlink_target = { fg = "#888578", italic = true }

[filetype]
rules = [
    { mime = "image/*", fg = "#dbbc7f" },
    { mime = "{audio,video}/*", fg = "#d699b6" },
    { mime = "application/{zip,rar,7z-compressed,xz,zstd,tar,gzip,bzip}*", fg = "#e67e80" },
    { mime = "application/{pdf,doc,rtf}", fg = "#83c092" },
    { name = "*", is = "orphan", fg = "#e67e80" },
    { name = "*", is = "exec", fg = "#a7c080" },
    { name = "*/", fg = "#7fbbb3" },
]
