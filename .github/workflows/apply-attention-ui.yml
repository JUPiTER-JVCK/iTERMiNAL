name: apply-attention-ui
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-attention-ui.yml"
      - "scripts/apply_attention_ui.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply attention UI patches
        run: |
          set -euo pipefail
          python3 scripts/apply_attention_ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/iTERMiNAL/Chrome/SidebarView.swift Sources/iTERMiNAL/Settings/SettingsViews.swift
          git commit -m "feat: sidebar attention dots + Notifications settings"
          git rm -f scripts/apply_attention_ui.py .github/workflows/apply-attention-ui.yml
          git commit -m "chore: remove apply-attention-ui helpers"
          git push
