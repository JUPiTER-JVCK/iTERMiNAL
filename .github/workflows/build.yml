name: Build

# Branches with an open PR are covered by the pull_request trigger, so the
# push trigger is scoped to main — otherwise every PR push builds twice.
on:
  push:
    branches: [main]
    # A version tag cuts a real release. branches and tags are OR'd, so this
    # does not narrow the main-branch trigger above.
    tags: ['v*']
  pull_request:
  # Cuts a version release without anyone pushing a tag.
  #
  # Tag writes are not available to every client that drives this repository
  # (the Claude Code GitHub relay refuses refs/tags/* and the releases API
  # outright), so "push a tag" is not a step everyone can perform. GITHUB_TOKEN
  # inside Actions is not subject to that, and `gh release create --target`
  # creates the tag as a side effect — the same mechanism the per-build
  # releases below already rely on.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, with or without the v (e.g. 0.112 or v0.112)'
        required: true
        type: string

# Read-only by default; only the release job gets write, and only to contents.
permissions:
  contents: read

# The artifact people download should be the build they would ship: the
# unoptimised configuration carries assertions and is not what to test
# against. Named once so the build, the verification and the packaging step
# can never drift apart.
env:
  CONFIGURATION: Release

jobs:
  # btop ships inside the app, and upstream publishes no macOS binaries ("No
  # MacOs or BSD binaries provided"). It needs GCC 14+ or Clang 19+ and does
  # not support Xcode's clang, so it is compiled here with Homebrew's gcc@15 —
  # once per architecture on a native runner, because GCC cannot
  # cross-compile between them. The build job merges the two slices.
  #
  # Cached on the pin and on the build script itself, so the compile happens
  # when either changes and every other run restores it in seconds.
  btop:
    name: Build btop (${{ matrix.arch }})
    strategy:
      # Each architecture's result is worth having on its own. With the
      # default fail-fast, an arm64 failure cancelled the Intel leg, leaving
      # no way to tell whether x86_64 built without spending another run.
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Derive cache key
        id: pins
        run: |
          set -euo pipefail
          . scripts/tools.env
          script_hash=$(shasum -a 256 scripts/build-btop.sh | cut -c1-12)
          echo "key=btop-${BTOP_VERSION}-${BTOP_COMMIT}-${{ matrix.arch }}-gcc15-${script_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore built btop
        id: cache
        uses: actions/cache@v6
        with:
          path: btop-out
          key: ${{ steps.pins.outputs.key }}

      # build-btop.sh refuses any result that links a library outside
      # /usr/lib and /System/Library, and runs it before handing it back.
      - name: Build btop
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install gcc@15 make
          scripts/build-btop.sh btop-out

      - name: Upload slice
        uses: actions/upload-artifact@v6
        with:
          name: btop-${{ matrix.arch }}
          path: btop-out/
          if-no-files-found: error

  build:
    name: Build (macOS)
    needs: btop
    runs-on: macos-15
    steps:
      # fetch-depth: 0 because CFBundleVersion below is the commit count, and
      # the default depth-1 checkout would make that 1 — every build claiming
      # to be the first. The repository is small enough that the cost is noise.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Check this before spending three minutes on a build. Immutable
      # releases reserve a tag name permanently once it has backed a published
      # release, so a name that is already taken cannot be recovered by
      # deleting anything — the run has to stop before it creates one.
      - name: Check the version is free
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION#v}"
          # A malformed tag is as permanent as a duplicate one.
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+(\.[0-9]+)*$'; then
            echo "::error::'$tag' is not a version tag (expected v1, v0.112, v1.2.3)."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Immutable releases reserve a tag name for good, so pick the next version."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists without a release. Delete it by hand, or pick the next version."
            exit 1
          fi
          echo "$tag is free."

      # Not `brew install xcodegen`. The runner image ships an untrusted
      # `aws/tap`, so every brew invocation printed a tap-trust warning that
      # had nothing to do with this project. Taking the tool straight from its
      # own release skips Homebrew entirely — no warning, and much faster than
      # letting brew update itself first.
      - name: Install XcodeGen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/xcodegen"
          mkdir -p "$dir"
          gh release download --repo yonaskolb/XcodeGen \
            --pattern '*.zip' --dir "$dir" --clobber
          for archive in "$dir"/*.zip; do
            unzip -q "$archive" -d "$dir"
          done
          # Locate the binary rather than assuming where in the archive it
          # sits; unzip preserves the layout either way, so the tool still
          # finds its own share/ resources next to it.
          binary=$(find "$dir" -type f -name xcodegen -perm -u+x | head -1)
          if [ -z "$binary" ]; then
            echo "::error::no xcodegen binary in the XcodeGen release archive"
            exit 1
          fi
          echo "$(dirname "$binary")" >> "$GITHUB_PATH"
          # Fail here, with a clear reason, rather than at project generation.
          "$binary" --version

      # Each slice lands in its own btop-slices/btop-<arch>/ directory.
      - uses: actions/download-artifact@v7
        with:
          pattern: btop-*
          path: btop-slices

      # Vendor/Tools and Vendor/Fonts are what project.yml's copy phase puts
      # into Contents/Resources/Tools and /Fonts. Artifacts do not keep the
      # executable bit, hence the chmod; lipo reads the file either way.
      - name: Assemble bundled tools and fonts
        run: |
          set -euo pipefail
          . scripts/tools.env
          tools=Vendor/Tools
          mkdir -p "$tools/licenses"

          lipo -create -output "$tools/btop" \
            btop-slices/btop-arm64/btop \
            btop-slices/btop-x86_64/btop
          codesign --force --sign - "$tools/btop"
          chmod 755 "$tools/btop"
          cp btop-slices/btop-arm64/licenses/btop-LICENSE.txt "$tools/licenses/btop-LICENSE.txt"

          scripts/fetch-superfile.sh "$tools"

          # Read by the About box, so it reports what was actually bundled
          # rather than a second copy of the pins that could drift.
          printf '{"btop":"%s","superfile":"%s"}\n' \
            "$BTOP_VERSION" "$SUPERFILE_VERSION" > "$tools/manifest.json"
          ls -la "$tools" "$tools/licenses"

          # The terminal's fallback for the icons superfile draws.
          scripts/fetch-symbols-font.sh Vendor/Fonts
          ls -la Vendor/Fonts Vendor/Fonts/licenses

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # A tag build has to carry the tag's version, or v0.3.0 would ship an
          # app whose About box still says whatever project.yml last hardcoded.
          # The empty-array expansion below is safe because Actions runs
          # `bash -e`, not `bash -u` — under set -u, bash 3.2 on macOS treats
          # "${ARR[@]}" on an empty array as an unbound variable.
          # A manual run reports GITHUB_REF_TYPE as "branch" even though it is
          # cutting a version, so the input has to be checked first — keying
          # off the ref alone would ship the version hardcoded in project.yml
          # under a v-numbered release.
          VERSION_ARG=()
          short_version=""
          if [ -n "${RELEASE_VERSION:-}" ]; then
            short_version="${RELEASE_VERSION#v}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            short_version="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$short_version" ]; then
            VERSION_ARG+=("MARKETING_VERSION=$short_version")
          else
            # Not a release, so project.yml's value stands. Read it back rather
            # than restating it here, or the two drift and the check below
            # starts asserting a number nothing produces.
            short_version=$(awk '/^ *MARKETING_VERSION:/ { print $2; exit }' project.yml)
          fi

          # CFBundleVersion is how macOS decides which of two bundles is newer.
          # It was a constant 3 in project.yml, so all 116 builds published so
          # far are indistinguishable to the system. The commit count is
          # monotonic and survives what GITHUB_RUN_NUMBER does not: that one is
          # scoped to a single workflow and restarts at 1 if this file is ever
          # renamed, walking back over numbers already shipped.
          build_number=$(git rev-list --count HEAD)
          VERSION_ARG+=("CURRENT_PROJECT_VERSION=$build_number")

          # Hand both to the verification step, so it checks what this step
          # actually asked for instead of a value copied by hand.
          {
            echo "EXPECTED_SHORT_VERSION=$short_version"
            echo "EXPECTED_BUNDLE_VERSION=$build_number"
          } >> "$GITHUB_ENV"
          xcodebuild \
            -project iTERMiNAL.xcodeproj \
            -scheme iTERMiNAL \
            -configuration "$CONFIGURATION" \
            -destination "platform=macOS" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            "${VERSION_ARG[@]}" \
            build

      # The app promises a bundled iterminalctl (Settings → Security installs
      # it). That went missing for weeks because nothing checked, so check.
      - name: Verify bundle contents
        run: |
          APP="build/Build/Products/$CONFIGURATION/iTERMiNAL.app"
          fail=0
          for path in \
            "$APP/Contents/MacOS/iTERMiNAL" \
            "$APP/Contents/Resources/iterminalctl" \
            "$APP/Contents/Resources/AppIcon.icns"
          do
            if [ ! -e "$path" ]; then
              echo "::error::missing from the app bundle: $path"
              fail=1
            fi
          done
          # Universal binary: both slices, or Intel Macs get nothing.
          for arch in x86_64 arm64; do
            if ! lipo -archs "$APP/Contents/MacOS/iTERMiNAL" | grep -qw "$arch"; then
              echo "::error::main binary is missing the $arch slice"
              fail=1
            fi
          done

          # The versions the build was told to use have to be the versions in
          # the bundle. Nothing checked this before, which is how
          # MARKETING_VERSION sat two major versions behind the release series
          # and CFBundleVersion stayed a constant 3 across every build
          # published — both silent, both only visible in an About box nobody
          # opens.
          plist="$APP/Contents/Info.plist"
          got_short=$(plutil -extract CFBundleShortVersionString raw -o - "$plist" 2>/dev/null || echo "")
          got_bundle=$(plutil -extract CFBundleVersion raw -o - "$plist" 2>/dev/null || echo "")
          if [ "$got_short" != "$EXPECTED_SHORT_VERSION" ]; then
            echo "::error::CFBundleShortVersionString is '$got_short', expected '$EXPECTED_SHORT_VERSION'"
            fail=1
          fi
          if [ "$got_bundle" != "$EXPECTED_BUNDLE_VERSION" ]; then
            echo "::error::CFBundleVersion is '$got_bundle', expected '$EXPECTED_BUNDLE_VERSION'"
            fail=1
          fi
          echo "version: $got_short (build $got_bundle)"

          # The bundled tools, checked in the bundle rather than in Vendor/:
          # a copy phase that silently skipped, or dropped the executable bit,
          # would pass every check made on the inputs. Each must be present,
          # executable, universal, link only what a stock Mac has, and run.
          tools="$APP/Contents/Resources/Tools"
          for tool in spf btop; do
            bin="$tools/$tool"
            if [ ! -x "$bin" ]; then
              echo "::error::bundled $tool is missing or not executable: $bin"
              fail=1
              continue
            fi
            for arch in x86_64 arm64; do
              if ! lipo -archs "$bin" | grep -qw "$arch"; then
                echo "::error::bundled $tool is missing the $arch slice"
                fail=1
              fi
            done
            foreign=$(otool -L "$bin" | awk '/^\t/ { print $1 }' \
              | awk '!/^\/usr\/lib\// && !/^\/System\/Library\//')
            if [ -n "$foreign" ]; then
              echo "::error::bundled $tool links libraries a stock Mac does not have: $foreign"
              fail=1
            fi
            # This runner is arm64, so only the arm64 slice runs here. btop's
            # x86_64 slice already ran on the Intel runner that built it;
            # superfile's is upstream's release binary, checked by hash but
            # never executed by this workflow.
            if ! "$bin" --version; then
              echo "::error::bundled $tool does not run"
              fail=1
            fi
          done
          # MIT and Apache-2.0 both require the notice to ship with the binary.
          for file in licenses/superfile-LICENSE.txt licenses/btop-LICENSE.txt manifest.json; do
            if [ ! -s "$tools/$file" ]; then
              echo "::error::missing from bundled tools: $file"
              fail=1
            fi
          done

          # The symbols font, with its notice and the icon sets' credits.
          fonts="$APP/Contents/Resources/Fonts"
          for file in SymbolsNerdFontMono-Regular.ttf manifest.json \
            licenses/nerd-fonts-symbols-LICENSE.txt licenses/nerd-fonts-symbols-README.md
          do
            if [ ! -s "$fonts/$file" ]; then
              echo "::error::missing from bundled fonts: $file"
              fail=1
            fi
          done
          # Present is not the same as working. This compiles the app's own
          # SymbolsFont.swift beside a small check and lays out icons the way
          # SwiftTerm does, so it fails if CoreText would draw them with
          # anything but the bundled face.
          if [ -s "$fonts/SymbolsNerdFontMono-Regular.ttf" ]; then
            check="$RUNNER_TEMP/font-check"
            if ! swiftc -o "$check" \
                Sources/iTERMiNAL/Terminal/SymbolsFont.swift \
                scripts/font-fallback-check/main.swift; then
              echo "::error::the font fallback check did not compile"
              fail=1
            elif ! "$check" "$fonts/SymbolsNerdFontMono-Regular.ttf"; then
              echo "::error::terminal icons do not resolve to the bundled symbols font"
              fail=1
            fi
          fi

          exit $fail

      # ditto preserves the bundle structure; a plain zip would mangle it.
      - name: Package app
        run: |
          ditto -c -k --keepParent \
            "build/Build/Products/$CONFIGURATION/iTERMiNAL.app" \
            iTERMiNAL.zip

      # Kept alongside the release below: this is how a PR branch that hasn't
      # merged gets tested, and releases are only cut from pushes.
      - name: Upload app
        uses: actions/upload-artifact@v6
        with:
          name: iTERMiNAL-app
          path: iTERMiNAL.zip
          if-no-files-found: error

  # Workflow artifacts need a signed-in GitHub account to download and expire
  # after 90 days, so they cannot be how anyone actually gets the app. A
  # release can be downloaded by anyone, keeps its link, and puts a Releases
  # section in the repo sidebar — which is where people look for an app rather
  # than the green Code button, which hands over source.
  release:
    name: Publish release
    needs: build
    # Never from a pull request: a PR branch is not something to publish.
    # Everything else — a push to main, a v* tag, a manual version run — does.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history, because the v* arm below picks the previous version tag
      # out of the tag list and the default depth-1 checkout fetches no tags
      # at all. The repository is small enough that the cost is noise.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Extracts iTERMiNAL.zip (the packaged bundle) into the working directory.
      - name: Download the built app
        uses: actions/download-artifact@v7
        with:
          name: iTERMiNAL-app

      # gh is preinstalled on the runner. Using it rather than a third-party
      # release action keeps the step that publishes a downloadable binary free
      # of dependencies outside GitHub itself.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Which tag this run is publishing, if any. A manual run supplies it
          # as an input; a tag push carries it on the ref; a main build has
          # none and takes the per-build path at the bottom.
          if [ -n "${RELEASE_VERSION:-}" ]; then
            TARGET_TAG="v${RELEASE_VERSION#v}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TARGET_TAG="$GITHUB_REF_NAME"
          else
            TARGET_TAG=""
          fi

          # Every release says this, because it is the first thing that goes
          # wrong: macOS quarantines anything downloaded through a browser, and
          # these builds are unsigned.
          gatekeeper=$(cat <<'NOTE'

          ## Installing

          ```sh
          unzip iTERMiNAL-*.zip
          xattr -dr com.apple.quarantine iTERMiNAL.app
          open iTERMiNAL.app
          ```

          This build is **unsigned**, so without the `xattr` line Gatekeeper
          refuses to open it ("damaged or can't be verified"). Right-click →
          Open works too. Proper signing needs an Apple Developer ID this
          project doesn't have yet.

          Universal binary — Intel and Apple Silicon. Requires macOS 14 or later.
          NOTE
          )

          if [ -n "$TARGET_TAG" ]; then
            asset="iTERMiNAL-${TARGET_TAG}-universal.zip"
            mv iTERMiNAL.zip "$asset"

            # State where the changelog starts rather than letting the API
            # choose. Left to itself generate-notes picks the previous
            # release, and every main build now publishes a `build-*`
            # prerelease — so the baseline would be a build from minutes
            # earlier at this very commit, and the one release people are
            # meant to download would ship an empty changelog. What the
            # endpoint does when previous_tag_name is omitted is not
            # documented either way, which is reason enough to say it.
            # The previous version is the highest tag sorting *below* this
            # one, which is not the same as the newest tag that isn't this
            # one: cutting a v0.9.1 hotfix once v0.10.0 exists would pick
            # v0.10.0 and ask for a range running backwards. Walk the list in
            # ascending version order and keep the last tag seen before this
            # one. Empty means this is the earliest version tag.
            # On a manual run this tag does not exist yet, so walking only
            # the existing tags would never reach it and `last` would end up
            # as the newest tag of all — which for a v0.9.1 cut after v0.10.0
            # is the same backwards range the ascending walk exists to avoid.
            # Fold the target into the list first, so its position is real
            # whether or not the tag has been created.
            prev=$( { printf '%s\n' "$TARGET_TAG"; git tag --list 'v*'; } \
              | sort -u -V \
              | awk -v cur="$TARGET_TAG" '$0 == cur { exit } { last = $0 } END { print last }')

            if [ -n "$prev" ]; then
              # Ask for the changelog explicitly rather than passing
              # --generate-notes alongside --notes: which of the two wins when
              # both are given is a gh implementation detail, and losing the
              # install instructions would be silent. An empty changelog is
              # survivable; the install section is not.
              changelog=$(gh api --method POST \
                "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f tag_name="$TARGET_TAG" \
                -f previous_tag_name="$prev" --jq .body || true)
            else
              # The first version tag has no predecessor to diff against, and
              # every other tag in this repository is a build tag rather than
              # a version. Say so instead of asking for a range that has no
              # meaningful start.
              changelog="First v-prefixed release — see the commit history for what came before."
            fi

            notes="${changelog}
          $gatekeeper"

            # A release can already exist for this tag if it was created from
            # the Releases UI before this workflow runs. Update it to the
            # workflow's asset and notes rather than failing on re-create.
            if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
              gh release upload "$TARGET_TAG" "$asset" --clobber
              gh release edit "$TARGET_TAG" \
                --title "$TARGET_TAG" \
                --notes "$notes"
            else
              # --target is what creates the tag on a manual run, pinned to the
              # commit this run actually built rather than to wherever the
              # branch has moved since. On a tag push it names the same commit
              # the ref already points at, so it changes nothing there.
              gh release create "$TARGET_TAG" "$asset" \
                --title "$TARGET_TAG" \
                --target "$GITHUB_SHA" \
                --notes "$notes"
            fi
          else
            # One release per build, with a tag that has never been used.
            #
            # This repository has immutable releases enabled, under which a tag
            # name that has ever backed a published release is reserved
            # permanently. The previous design deleted and recreated a release
            # tagged `latest` on every build, which that forbids outright: three
            # consecutive main builds failed with "tag_name was used by an
            # immutable release", and `latest` is now burned on this repo for
            # good — the tag itself is gone, deleted by the old --cleanup-tag,
            # and creating it still 422s.
            #
            # The tag is built from run_id and run_attempt, not run_number.
            # Uniqueness has to be structural here: a collision is not a failed
            # build you retry, it burns that tag on this repository for good.
            #
            # run_number counts runs of *one workflow*, so renaming or
            # recreating this file restarts it at 1 and walks back over
            # build-1, build-2… It also does not change when a run is re-run,
            # so a retry after a partly-successful publish would reuse the tag
            # it just created. run_id is unique per repository and never
            # reissued; run_attempt separates re-runs of the same run. Between
            # them there is no path back to a name already used.
            #
            # run_number stays in the title and asset name, where it is for
            # humans and need not be unique.
            #
            # Nothing is deleted: under immutability that cannot succeed, and
            # the old `|| true` on the delete is what let a broken publish path
            # look survivable.
            tag="build-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            asset="iTERMiNAL-build-${GITHUB_RUN_NUMBER}-universal.zip"
            mv iTERMiNAL.zip "$asset"
            subject=$(git log -1 --pretty=%s)
            gh release create "$tag" "$asset" \
              --title "Build ${GITHUB_RUN_NUMBER} — ${GITHUB_SHA:0:7}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --notes "Built from \`${GITHUB_SHA:0:7}\` — ${subject}
          $gatekeeper"
          fi
