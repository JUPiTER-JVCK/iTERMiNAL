name: iTERMiNAL
options:
  bundleIdPrefix: com.jupiterjvck
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # Pinned to v1.20.0: the newest release whose manifest (swift-tools 6.0)
    # builds with Xcode 16.x; every API the engine wrapper uses was verified
    # present at this revision.
    revision: 5d14406844143538cd8f8851d2d8a67c1fe443e5

targets:
  iTERMiNAL:
    type: application
    platform: macOS
    sources:
      - Sources/iTERMiNAL
      - path: Resources/Assets.xcassets
    dependencies:
      - package: SwiftTerm
      # The CLI ships inside the app bundle; Settings → Security installs it
      # into ~/.local/bin on request.
      #
      # embed must stay true: XcodeGen only honours `copy` for embedded
      # dependencies ("This only applies when embed is true"), so with
      # embed: false the tool was built and made a dependency but never
      # copied into Resources — and Install iterminalctl… could not find it.
      - target: iterminalctl
        link: false
        embed: true
        copy:
          destination: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: iTERMiNAL
        CFBundleDisplayName: iTERMiNAL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT License — iTERMiNAL contributors"
        # macOS resolves an asset-catalog icon through CFBundleIconName; an
        # AppIcon set alone leaves the Dock showing the generic placeholder.
        CFBundleIconName: AppIcon
        NSPrincipalClass: NSApplication
        # Shown when macOS asks whether this app may browse the local network.
        # It is asked for Bonjour discovery in Settings → Connections, which
        # only ever browses: nothing about this Mac is advertised, and no
        # connection is opened until the user picks a result. Declining leaves
        # that list empty and changes nothing else.
        NSLocalNetworkUsageDescription: >-
          iTERMiNAL looks for machines on your network advertising screen
          sharing, SSH or file sharing, so you can connect without typing an
          address. It advertises nothing about this Mac.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Scope the ATS exception to web-view content only, so the browser
        # pane can preview a plain-http dev server without weakening the
        # transport policy for the rest of the app.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          # Lets the assistant reach a local model server over plain HTTP
          # (Ollama on 127.0.0.1), which the web-content key above does not
          # cover: that one governs WKWebView, while the assistant uses
          # URLSession, so without this the documented loopback preset fails
          # with -1022 before a request is ever sent.
          #
          # This is the narrow key, not a widening of the exemption:
          # NSAllowsLocalNetworking permits loopback and local-link addresses
          # only. Anything routable still has to be HTTPS with ATS intact.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jupiterjvck.iterminal
        # XcodeGen doesn't set this the way Xcode's own app template does, so
        # without it actool compiles the icon set and nothing ever uses it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The version a build reports when it is NOT a release: local Xcode
        # builds and the per-build `build-*` CI releases. A tagged or
        # dispatched release overrides this from the version being cut, so
        # this value is never what a real release ships.
        #
        # It is the version being worked toward, not the last one published —
        # otherwise an untagged build would claim to be a release it is not.
        # Left at 0.3.0 it claimed to be two major versions behind: Build 116
        # reported 0.3.0 while the newest release was v3.9.5.
        MARKETING_VERSION: 4.0.0
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        # Universal so the app runs natively on Intel and Apple Silicon.
        ARCHS: "x86_64 arm64"
        ONLY_ACTIVE_ARCH: "NO"
        # A terminal exists to launch the user's own programs, and sandboxed
        # children inherit the sandbox — a sandboxed build could not read
        # ~/.ssh, Homebrew tools, or repos outside its container. Hardened
        # Runtime is the part notarization actually requires, and it does not
        # restrict spawned processes.
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        # No entitlements file. The only one this project ever had existed for
        # a CloudKit container, which needed an Apple Developer account to
        # bind — so the feature behind it was dead in every build anyone could
        # actually make. Backups are snapshot files now and need no
        # entitlement. Hardened Runtime is what notarization requires and is
        # set above; it needs no entitlements of its own.
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: "YES"
        # Stated rather than inherited: the copy phase below reads Vendor/,
        # outside anything Xcode would grant a sandboxed script, and a
        # sandboxed phase fails in a way that is easy to misread as "the
        # tools were not fetched".
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # superfile and btop, built or fetched by scripts/ at the versions pinned
    # in scripts/tools.env. A post-build phase rather than a resource entry so
    # a local build without Vendor/Tools still builds — it just ships without
    # them, and the panels say so. ditto keeps the executable bit, which CI
    # then checks in the finished bundle.
    postBuildScripts:
      - name: Copy bundled tools
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          src="$SRCROOT/Vendor/Tools"
          dst="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Tools"
          if [ ! -d "$src" ]; then
            echo "note: $src not found; building without superfile and btop (see scripts/tools.env)"
            exit 0
          fi
          rm -rf "$dst"
          ditto "$src" "$dst"
    scheme:
      testTargets: []

  iterminalctl:
    type: tool
    platform: macOS
    sources:
      - Sources/iterminalctl
    settings:
      base:
        PRODUCT_NAME: iterminalctl
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ARCHS: "x86_64 arm64"
        ONLY_ACTIVE_ARCH: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_IDENTITY: "-"
