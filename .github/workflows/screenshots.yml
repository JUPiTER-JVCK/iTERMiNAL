name: Screenshots

# The README's pictures, taken from the real app rather than drawn.
#
# The app is built with its capture mode compiled in (SCREENSHOTS — no shipped
# build defines it), launched against a sample project and a small local web
# server, and writes PNGs of its own windows (Sources/iTERMiNAL/App/
# ScreenshotMode.swift). They are uploaded as an artifact; nothing here
# publishes anything. To update the README, copy them from the artifact into
# docs/images/ (workspace, http-client, site-explorer, split-panes and
# appearance come from main, http-request, http-explore, splits and
# settings-appearance).
on:
  # Retake them by hand after the interface changes. Unlike build.yml's manual
  # run, this one releases nothing.
  workflow_dispatch:
  # And when the capture itself changes, so that a break in it shows up in the
  # pull request that causes it. The normal build cannot see one: the capture
  # code is compiled out of it.
  pull_request:
    paths:
      - .github/workflows/screenshots.yml
      - scripts/screenshots/**
      - Sources/iTERMiNAL/App/ScreenshotMode.swift

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshots (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The same way build.yml installs it, and for the same reason: straight
      # from its release, not through Homebrew.
      - name: Install XcodeGen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/xcodegen"
          mkdir -p "$dir"
          gh release download --repo yonaskolb/XcodeGen \
            --pattern '*.zip' --dir "$dir" --clobber
          for archive in "$dir"/*.zip; do
            unzip -q "$archive" -d "$dir"
          done
          binary=$(find "$dir" -type f -name xcodegen -perm -u+x | head -1)
          if [ -z "$binary" ]; then
            echo "::error::no xcodegen binary in the XcodeGen release archive"
            exit 1
          fi
          echo "$(dirname "$binary")" >> "$GITHUB_PATH"
          "$binary" --version

      - name: Generate Xcode project
        run: xcodegen generate

      # No bundled btop, superfile or fonts: the app builds and runs without
      # them (its copy phase says so and carries on), and none of the pictures
      # are of those. This arch only — the runner's own — to keep it quick.
      - name: Build with capture mode
        run: |
          set -euo pipefail
          xcodebuild \
            -project iTERMiNAL.xcodeproj \
            -scheme iTERMiNAL \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) SCREENSHOTS' \
            build

      # One step, so the site and the app live and die together. The app's exit
      # status is reported, not fatal, so its log is always printed and whatever
      # pictures it got to are always uploaded. Actions starts bash with -e, so
      # that has to be switched off here — `set -uo pipefail` alone leaves it on,
      # and a failing `wait` would end the step before the log was shown.
      - name: Take the screenshots
        run: |
          set +e
          set -uo pipefail
          projects="$HOME/Developer"
          zdot="$RUNNER_TEMP/zdotdir"
          requests="$RUNNER_TEMP/requests.log"
          shots="$GITHUB_WORKSPACE/screenshots"
          log="$RUNNER_TEMP/app.log"
          mkdir -p "$shots"
          scripts/screenshots/prepare-demo.sh "$projects" "$zdot"

          python3 scripts/screenshots/fixture_server.py \
            --port 8765 --log "$requests" > "$RUNNER_TEMP/fixture.out" 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8765/robots.txt; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::the sample site did not start"
            cat "$RUNNER_TEMP/fixture.out"
            exit 1
          fi

          # New terminals start in the sample project. The request log starts
          # empty, so the terminal that shows it shows only this run.
          defaults write com.jupiterjvck.iterminal defaultDirectory "$projects/hello-api"
          : > "$requests"
          # A sleeping display draws nothing.
          caffeinate -dimsu -t 900 &
          # What the app is about to run on, for when a picture comes out wrong.
          sw_vers
          system_profiler SPDisplaysDataType 2>/dev/null | head -30

          # Run by its path, not with `open`: the environment below reaches the
          # app and, through it, the shells it starts. It still comes to the
          # front, which is what makes its window key.
          app="$PWD/build/Build/Products/Release/iTERMiNAL.app/Contents/MacOS/iTERMiNAL"
          env SHELL=/bin/zsh ZDOTDIR="$zdot" \
            ITERMINAL_SCREENSHOT_DIR="$shots" \
            ITERMINAL_DEMO_DIR="$projects/hello-api" \
            ITERMINAL_FIXTURE_LOG="$requests" \
            "$app" > "$log" 2>&1 &
          pid=$!

          status=timeout
          for _ in $(seq 1 300); do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"
              status=$?
              break
            fi
            sleep 1
          done
          if [ "$status" = timeout ]; then
            kill "$pid" 2>/dev/null || true
          fi
          echo "app exit status: $status"

          cp "$log" "$shots/app.log"
          cp "$requests" "$shots/requests.log"
          echo "---- app log"
          cat "$log"
          if ! grep -q 'finished' "$log"; then
            for report in "$HOME"/Library/Logs/DiagnosticReports/iTERMiNAL*; do
              [ -e "$report" ] || continue
              echo "---- crash report: $report"
              head -c 8000 "$report"
            done
          fi
          echo "---- files"
          ls -la "$shots"

          if ! ls "$shots"/*.png > /dev/null 2>&1; then
            echo "::error::the app wrote no pictures"
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
