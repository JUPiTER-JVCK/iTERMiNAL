name: Build

# Branches with an open PR are covered by the pull_request trigger, so the
# push trigger is scoped to main — otherwise every PR push builds twice.
on:
  push:
    branches: [main]
    # A version tag cuts a real release. branches and tags are OR'd, so this
    # does not narrow the main-branch trigger above.
    tags: ['v*']
  pull_request:
  # Saving a draft release in the web UI is the pre-publication path that lets
  # CI attach the app before immutable release assets lock on publish.
  release:
    types: [created]

# Read-only by default; only the release job gets write, and only to contents.
permissions:
  contents: read

# The artifact people download should be the build they would ship: the
# unoptimised configuration carries assertions and is not what to test
# against. Named once so the build, the verification and the packaging step
# can never drift apart.
env:
  CONFIGURATION: Release

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      # fetch-depth: 0 because the version below is the commit count, and a
      # depth-1 checkout would make that 1 — silently shipping 0.1.
      #
      # `ref` is empty for a push or a pull request, which checks out the
      # triggering ref as usual. For a draft release it is the tag, so the app
      # attached there is built from the code that release names.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || '' }}

      # Not `brew install xcodegen`. The runner image ships an untrusted
      # `aws/tap`, so every brew invocation printed a tap-trust warning that
      # had nothing to do with this project. Taking the tool straight from its
      # own release skips Homebrew entirely — no warning, and much faster than
      # letting brew update itself first.
      - name: Install XcodeGen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/xcodegen"
          mkdir -p "$dir"
          gh release download --repo yonaskolb/XcodeGen \
            --pattern '*.zip' --dir "$dir" --clobber
          for archive in "$dir"/*.zip; do
            unzip -q "$archive" -d "$dir"
          done
          # Locate the binary rather than assuming where in the archive it
          # sits; unzip preserves the layout either way, so the tool still
          # finds its own share/ resources next to it.
          binary=$(find "$dir" -type f -name xcodegen -perm -u+x | head -1)
          if [ -z "$binary" ]; then
            echo "::error::no xcodegen binary in the XcodeGen release archive"
            exit 1
          fi
          echo "$(dirname "$binary")" >> "$GITHUB_PATH"
          # Fail here, with a clear reason, rather than at project generation.
          "$binary" --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          # The version is the commit count, so nothing is hand-maintained and
          # nothing can drift. Hand-kept versions are what left 0.2.0, 0.3.0,
          # the tag v3.9 and the tag Main all disagreeing at once.
          #
          # Deliberately not GITHUB_RUN_NUMBER: that counts runs of *this
          # workflow file* and restarts at 1 if the file is renamed. A release
          # title that restarts is untidy; a version that goes backwards breaks
          # update checks and confuses every bug report.
          #
          # This also replaces deriving the version from the tag name, which
          # was fine for v0.3.0 and produced MARKETING_VERSION=Main for the tag
          # `Main` — now reachable, since a hand-drafted release's tag is not
          # always version-shaped.
          build_number=$(git rev-list --count HEAD)
          xcodebuild \
            -project iTERMiNAL.xcodeproj \
            -scheme iTERMiNAL \
            -configuration "$CONFIGURATION" \
            -destination "platform=macOS" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            "MARKETING_VERSION=0.$build_number" \
            "CURRENT_PROJECT_VERSION=$build_number" \
            build

      # The app promises a bundled iterminalctl (Settings → Security installs
      # it). That went missing for weeks because nothing checked, so check.
      - name: Verify bundle contents
        run: |
          APP="build/Build/Products/$CONFIGURATION/iTERMiNAL.app"
          fail=0
          for path in \
            "$APP/Contents/MacOS/iTERMiNAL" \
            "$APP/Contents/Resources/iterminalctl" \
            "$APP/Contents/Resources/AppIcon.icns"
          do
            if [ ! -e "$path" ]; then
              echo "::error::missing from the app bundle: $path"
              fail=1
            fi
          done
          # Universal binary: both slices, or Intel Macs get nothing.
          for arch in x86_64 arm64; do
            if ! lipo -archs "$APP/Contents/MacOS/iTERMiNAL" | grep -qw "$arch"; then
              echo "::error::main binary is missing the $arch slice"
              fail=1
            fi
          done
          exit $fail

      # ditto preserves the bundle structure; a plain zip would mangle it.
      - name: Package app
        run: |
          ditto -c -k --keepParent \
            "build/Build/Products/$CONFIGURATION/iTERMiNAL.app" \
            iTERMiNAL.zip

      # Kept alongside the release below: this is how a PR branch that hasn't
      # merged gets tested, and releases are only cut from pushes.
      - name: Upload app
        uses: actions/upload-artifact@v6
        with:
          name: iTERMiNAL-app
          path: iTERMiNAL.zip
          if-no-files-found: error

  # Workflow artifacts need a signed-in GitHub account to download and expire
  # after 90 days, so they cannot be how anyone actually gets the app. A
  # release can be downloaded by anyone, keeps its link, and puts a Releases
  # section in the repo sidebar — which is where people look for an app rather
  # than the green Code button, which hands over source.
  release:
    name: Publish release
    needs: build
    # Never from a pull request: a PR branch is not something to publish.
    # Everything else may: a push to main or a tag, or a draft release saved in
    # the UI so CI can attach the app before publication locks the asset set.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history, because the v* arm below picks the previous version tag
      # out of the tag list and the default depth-1 checkout fetches no tags
      # at all. The repository is small enough that the cost is noise.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Extracts iTERMiNAL.zip (the packaged bundle) into the working directory.
      - name: Download the built app
        uses: actions/download-artifact@v7
        with:
          name: iTERMiNAL-app

      # gh is preinstalled on the runner. Using it rather than a third-party
      # release action keeps the step that publishes a downloadable binary free
      # of dependencies outside GitHub itself.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty means this is an ordinary main build, which gets a build-*
          # prerelease of its own.
          TARGET_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail

          # Every release says this, because it is the first thing that goes
          # wrong: macOS quarantines anything downloaded through a browser, and
          # these builds are unsigned.
          gatekeeper=$(cat <<'NOTE'

          ## Installing

          ```sh
          unzip iTERMiNAL-*.zip
          xattr -dr com.apple.quarantine iTERMiNAL.app
          open iTERMiNAL.app
          ```

          This build is **unsigned**, so without the `xattr` line Gatekeeper
          refuses to open it ("damaged or can't be verified"). Right-click →
          Open works too. Proper signing needs an Apple Developer ID this
          project doesn't have yet.

          Universal binary — Intel and Apple Silicon. Requires macOS 14 or later.
          NOTE
          )

          if [ "$GITHUB_EVENT_NAME" = release ] && [ -z "$TARGET_TAG" ]; then
            echo "::error::Draft releases must be associated with a tag before CI can attach the app."
            exit 1
          fi

          if [ -n "$TARGET_TAG" ]; then
            asset="iTERMiNAL-${TARGET_TAG}-universal.zip"
            mv iTERMiNAL.zip "$asset"

            # State where the changelog starts rather than letting the API
            # choose. Left to itself generate-notes picks the previous
            # release, and every main build now publishes a `build-*`
            # prerelease — so the baseline would be a build from minutes
            # earlier at this very commit, and the one release people are
            # meant to download would ship an empty changelog. What the
            # endpoint does when previous_tag_name is omitted is not
            # documented either way, which is reason enough to say it.
            # The previous version is the highest tag sorting *below* this
            # one, which is not the same as the newest tag that isn't this
            # one: cutting a v0.9.1 hotfix once v0.10.0 exists would pick
            # v0.10.0 and ask for a range running backwards. Walk the list in
            # ascending version order and keep the last tag seen before this
            # one. Empty means this is the earliest version tag.
            prev=$(git tag --list 'v*' --sort=v:refname \
              | awk -v cur="$TARGET_TAG" '$0 == cur { exit } { last = $0 } END { print last }')

            if [ -n "$prev" ]; then
              # Ask for the changelog explicitly rather than passing
              # --generate-notes alongside --notes: which of the two wins when
              # both are given is a gh implementation detail, and losing the
              # install instructions would be silent. An empty changelog is
              # survivable; the install section is not.
              changelog=$(gh api --method POST \
                "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f tag_name="$TARGET_TAG" \
                -f previous_tag_name="$prev" --jq .body || true)
            else
              # The first version tag has no predecessor to diff against, and
              # every other tag in this repository is a build tag rather than
              # a version. Say so instead of asking for a range that has no
              # meaningful start.
              changelog="First v-prefixed release — see the commit history for what came before."
            fi

            # A release may already exist for this tag because someone saved a
            # draft in the web UI first. That is the supported UI path here:
            # immutable releases lock assets on publication, so the app has to
            # be attached while the release is still a draft.
            if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
              if [ "$(gh release view "$TARGET_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
                echo "::error::Release $TARGET_TAG is already published. Immutable releases lock published assets, so create the release as a draft first or push a new unused tag."
                exit 1
              fi
              echo "Draft release $TARGET_TAG already exists; attaching the app to it."
              if ! gh release upload "$TARGET_TAG" "$asset" --clobber; then
                echo "::error::Could not attach $asset to the draft $TARGET_TAG release."
                exit 1
              fi
              gh release edit "$TARGET_TAG" \
                --title "$TARGET_TAG" \
                --notes "${changelog}
          $gatekeeper"
            else
              gh release create "$TARGET_TAG" "$asset" \
                --title "$TARGET_TAG" \
                --notes "${changelog}
          $gatekeeper"
            fi
          else
            # One release per build, with a tag that has never been used.
            #
            # This repository has immutable releases enabled, under which a tag
            # name that has ever backed a published release is reserved
            # permanently. The previous design deleted and recreated a release
            # tagged `latest` on every build, which that forbids outright: three
            # consecutive main builds failed with "tag_name was used by an
            # immutable release", and `latest` is now burned on this repo for
            # good — the tag itself is gone, deleted by the old --cleanup-tag,
            # and creating it still 422s.
            #
            # The tag is built from run_id and run_attempt, not run_number.
            # Uniqueness has to be structural here: a collision is not a failed
            # build you retry, it burns that tag on this repository for good.
            #
            # run_number counts runs of *one workflow*, so renaming or
            # recreating this file restarts it at 1 and walks back over
            # build-1, build-2… It also does not change when a run is re-run,
            # so a retry after a partly-successful publish would reuse the tag
            # it just created. run_id is unique per repository and never
            # reissued; run_attempt separates re-runs of the same run. Between
            # them there is no path back to a name already used.
            #
            # run_number stays in the title and asset name, where it is for
            # humans and need not be unique.
            #
            # Nothing is deleted: under immutability that cannot succeed, and
            # the old `|| true` on the delete is what let a broken publish path
            # look survivable.
            tag="build-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            asset="iTERMiNAL-build-${GITHUB_RUN_NUMBER}-universal.zip"
            mv iTERMiNAL.zip "$asset"
            subject=$(git log -1 --pretty=%s)
            gh release create "$tag" "$asset" \
              --title "Build ${GITHUB_RUN_NUMBER} — ${GITHUB_SHA:0:7}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --notes "Built from \`${GITHUB_SHA:0:7}\` — ${subject}
          $gatekeeper"
          fi
